[project]
name = "portfolio-backend"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<3.14"
dependencies = [
    # Starlette 1.x (security fixes) needs a fastapi newer than 0.115; the old
    # <0.116 bound capped starlette below 0.47.
    "fastapi (>=0.162.0,<1.0.0)",
    "openai (>=2.26.0,<3.0.0)",
    "python-dotenv (==1.2.2)",
    "uvicorn==0.32.0",
    "mssql-python==1.12.0",
    "langchain (==1.4.9)",
    "langgraph (==1.2.20)",
    "langgraph-prebuilt (==1.1.1)",
    "copilotkit (==0.1.94)",
    "ag-ui-langgraph (==0.0.42)",
    "langchain-openai (==1.3.3)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
    "azure-identity (==1.25.3)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (==0.17.2)",
    "pyright (==1.1.414)",
]

[tool.pyright]
include = ["agent", "blog", "services", "scripts", "tests", "main.py"]
exclude = ["**/.venv", "backup"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

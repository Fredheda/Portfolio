[project]
name = "portfolio-backend"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.115.12,<0.116)",
    "openai (>=2.26.0,<3.0.0)",
    "pydantic==2.12.5",
    "python-dotenv==1.0.1",
    "uvicorn==0.32.0",
    "slowapi==0.1.9",
    "azure-core==1.32.0",
    "azure-search-documents==11.5.2",
    "mssql-python==1.12.0",
    "langchain (==1.2.10)",
    "langgraph (==1.0.10)",
    "langgraph-prebuilt (==1.0.8)",
    "copilotkit (==0.1.94)",
    "ag-ui-langgraph (==0.0.42)",
    "langchain-openai (==1.3.3)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)"
]

name: CI

# Pull requests only: a push to main runs no CI, because the PR that landed it
# already did. Images are not built here either; the manual Deploy apps
# workflow builds a commit the first time it is deployed.
on:
  pull_request:

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the PR changes anything but documentation (scripts/
  # changed-areas.sh). A docs-only PR skips the jobs below. They are skipped
  # by their own `if`, not by a workflow-level path filter, because a required
  # check (e2e) that never reports blocks the PR for good. If this job fails,
  # `code` is empty, which is not 'false', so everything still runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        run: ./scripts/changed-areas.sh "origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"

  # Tests, ruff (backend/, data/, mcp-tools/, scripts/ and e2e_backend/;
  # config: ruff.toml at the repo root) and pyright (backend/ only) share one
  # Poetry install.
  backend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
      - run: poetry run pytest -v
      - run: poetry run ruff check ../backend ../data ../mcp-tools ../scripts ../e2e_backend
      - run: poetry run ruff format --check ../backend ../data ../mcp-tools ../scripts ../e2e_backend
      - run: poetry run pyright

  # mcp-tools is an Azure Function with its own requirements.txt; test it in
  # an isolated venv, never in the backend's Poetry environment.
  mcp-tools-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: mcp-tools/requirements.txt
      # mcp-tools/content/ is gitignored; deploy-mcp-tools.sh copies the file
      # in at deploy time, and the tests need it.
      - run: mkdir -p mcp-tools/content && cp content/site-content.json mcp-tools/content/site-content.json
      - run: python -m venv mcp-tools/.venv
      - run: mcp-tools/.venv/bin/pip install -r mcp-tools/requirements.txt pytest==9.1.1
      - name: Run mcp-tools tests
        working-directory: mcp-tools
        run: .venv/bin/python -m pytest tests -v

  # The deploy and CI scripts are plain bash, tested against a fake `az`; they
  # need only pytest, so no project environment is installed.
  deploy-scripts-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - run: pip install pytest==9.1.1
      - run: python -m pytest scripts/tests -v

  # Vitest, eslint and the production build share one install.
  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same flags as frontend/Dockerfile: plain `npm ci` would run postinstall,
      # which runs a build.
      - run: npm ci --ignore-scripts
      # `pretest` syncs content/site-content.json into frontend/content/.
      - run: npm test
      - run: npm run lint
      # `prebuild` syncs content, then vite builds.
      - run: npm run build

  # Playwright against the production build, the real backend (scripted
  # model, fake moderation and logging) and the real mcp-tools handlers.
  # Offline; see frontend/playwright.config.js. The `main-protect` ruleset
  # requires this job by name, so keep the id.
  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

name: CI

# Pull requests only. Draft runs stay light; run ./scripts/ci-local.sh (mirrors this file) before ready.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only PRs skip jobs via their own `if` (a never-reporting required check blocks); empty `code` runs all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      data: ${{ steps.areas.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        run: ./scripts/changed-areas.sh "origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
      - run: poetry run pytest -v
      - run: poetry run ruff check ../backend ../data ../mcp-tools ../scripts ../e2e_backend
      - run: poetry run ruff format --check ../backend ../data ../mcp-tools ../scripts ../e2e_backend
      - run: poetry run pyright

  # mcp-tools: isolated venv, never the backend's Poetry environment.
  mcp-tools-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: mcp-tools/requirements.txt
      - run: mkdir -p mcp-tools/content && cp content/site-content.json mcp-tools/content/site-content.json
      - run: python -m venv mcp-tools/.venv
      - run: mcp-tools/.venv/bin/pip install pip==26.2.2
      - run: mcp-tools/.venv/bin/pip install --no-deps --only-binary=":all:" -r mcp-tools/requirements.txt
      - run: mcp-tools/.venv/bin/pip check
      - run: PIP_UPLOADED_PRIOR_TO=P14D mcp-tools/.venv/bin/pip install pytest==9.1.1
      - name: Run mcp-tools tests
        working-directory: mcp-tools
        run: .venv/bin/python -m pytest tests -v

  # Offline data/ tests only: never populate_index.py or IndexCreator.py (live index writes, paid embeddings).
  data:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.data != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken-cache
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: data/.python-version
          cache: poetry
          cache-dependency-path: data/poetry.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tiktoken-cache
          key: tiktoken-gpt2-v1
      - run: poetry install --no-root --no-interaction
      - run: poetry run pytest -v

  deploy-scripts-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
      - run: python -m pip install pip==26.2.2
      - run: PIP_UPLOADED_PRIOR_TO=P14D python -m pip install pytest==9.1.1
      - run: python -m pytest scripts/tests -v

  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Pinned like frontend/Dockerfile (scripts/tests/test_npm_pin.py checks both).
      - run: npm install -g npm@12.2.2 && npm --version
      # Same flags as frontend/Dockerfile: plain npm ci would run postinstall.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Production build
        if: ${{ github.event.pull_request.draft == false }}
        run: npm run build

  # The main-protect ruleset requires this job by name: keep the id.
  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
        working-directory: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@12.2.2 && npm --version
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

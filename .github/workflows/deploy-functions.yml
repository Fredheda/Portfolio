name: Deploy functions

# Manual, owner-approved in production. Rollback: rerun with an older SHA.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (empty = the head of main)
        required: false
        default: ""

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      # Scripts come from this checkout; the deployed commit is read via git archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keeps the git token off disk while the Azure session is open.
          persist-credentials: false

      - name: Resolve and validate the commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="$(./scripts/resolve-deploy-sha.sh "$INPUT_SHA")"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Extract that commit's sources
        run: |
          mkdir "$RUNNER_TEMP/src"
          git archive "$SHA" | tar -x -C "$RUNNER_TEMP/src"

      - name: Build the package
        run: ./scripts/package-functions.sh "$RUNNER_TEMP/src" "$RUNNER_TEMP/functions.zip"

      # Azure CLI OIDC login: azure/login is not on the repo's action allowlist.
      - name: Log in to Azure
        env:
          # Secrets, not variables: public run logs.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CLIENT_ID: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
        run: ./scripts/ci-azure-login.sh "$CLIENT_ID"

      - name: Deploy and check the functions
        run: |
          set -o pipefail
          ./scripts/deploy-functions.sh "$RUNNER_TEMP/functions.zip" | tee "$RUNNER_TEMP/deploy.log"

      - name: Summary
        run: |
          {
            echo "### Deployed \`$SHA\` to func-portfolio-mcp-tools"
            echo
            git log -1 --format=%s "$SHA"
            echo
            grep '^function: ' "$RUNNER_TEMP/deploy.log" | sed 's/^function: /- /'
          } >> "$GITHUB_STEP_SUMMARY"

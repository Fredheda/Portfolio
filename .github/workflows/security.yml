name: Security

# Pull requests and a weekly run; a merge to main starts nothing. gitleaks and
# workflow-lint run on every push to a PR, draft or not. The other jobs run
# when the PR is marked ready and on the weekly schedule, which also scans the
# full git history. Run each tool locally: see CLAUDE.md, "Security checks".
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Advisories appear without any code change, so the dependency audits also
  # run weekly.
  schedule:
    - cron: "23 5 * * 1"

# A new push to the same PR cancels the run that is still going. Scheduled
# runs are never cancelled.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Blocks the PR. Runs the pinned gitleaks image directly: the gitleaks
  # action needs a license key for organization repos.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # A PR scans only the commits it adds; the weekly run scans the whole
      # history.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_opts=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log_opts=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose "${log_opts[@]}"

  # Blocks the PR. The actionlint image is pinned; the repo allows only
  # GitHub-owned actions, so it runs as a container.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  # Advisory on PRs (a new advisory against an old dependency must not fail an
  # unrelated PR); the weekly run fails visibly. backend/ and data/ are
  # audited from their locked sets (`poetry export`) rather than installed:
  # data/ pulls heavy ML packages, and the locked versions are what ships.
  pip-audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Poetry with the export plugin
        run: |
          pipx install "poetry>=2.0,<3.0"
          pipx inject poetry poetry-plugin-export==1.9.0
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - name: Audit backend (locked set)
        run: |
          poetry -C backend export --without-hashes -o "$RUNNER_TEMP/backend.txt"
          pipx run pip-audit==2.10.1 -r "$RUNNER_TEMP/backend.txt" --no-deps --disable-pip
      - name: Audit data (locked set)
        run: |
          poetry -C data export --without-hashes -o "$RUNNER_TEMP/data.txt"
          pipx run pip-audit==2.10.1 -r "$RUNNER_TEMP/data.txt" --no-deps --disable-pip
      # mcp-tools/requirements.txt has version ranges, so pip-audit resolves
      # it in its own temporary venv.
      - name: Audit mcp-tools requirements
        run: pipx run pip-audit==2.10.1 -r mcp-tools/requirements.txt

  # Advisory on PRs, failing weekly, like pip-audit.
  npm-audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # Blocks the PR. HIGH severity only: bandit's lower levels are mostly noise
  # for this code.
  bandit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - run: pipx run bandit==1.9.4 -r backend data mcp-tools scripts e2e_backend -lll -x backend/tests,mcp-tools/tests,scripts/tests,.venv

  # Findings appear in the repo's Security tab, not as a failing check.
  codeql:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

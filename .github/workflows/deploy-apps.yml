name: Deploy apps

# Manual, owner-approved in production. Builds a commit's images on first deploy; rollback reuses them.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (empty = the head of main)
        required: false
        default: ""

concurrency:
  group: deploy-apps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keeps the git token off disk while the Azure session is open.
          persist-credentials: false

      - name: Resolve and validate the commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="$(./scripts/resolve-image-sha.sh "$INPUT_SHA")"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      # Azure CLI OIDC login: azure/login is not allowed. Build and deploy log in separately.
      - name: Log in to Azure to build
        env:
          # Secrets, not variables: public run logs.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CLIENT_ID: ${{ secrets.AZURE_BUILD_CLIENT_ID }}
        run: ./scripts/ci-azure-login.sh "$CLIENT_ID"

      - name: Build the missing images
        run: ./scripts/build-push.sh "$SHA"

      - name: Log in to Azure to deploy
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CLIENT_ID: ${{ secrets.AZURE_APPS_DEPLOY_CLIENT_ID }}
        run: |
          az logout
          ./scripts/ci-azure-login.sh "$CLIENT_ID"

      - name: Roll the apps
        run: ./scripts/redeploy.sh "$SHA"

      - name: Wait for the new revisions
        run: ./scripts/wait-healthy.sh

      - name: Summary
        run: |
          {
            echo "### Deployed \`$SHA\`"
            echo
            git log -1 --format=%s "$SHA"
            echo
            for app in ca-portfolio-backend ca-portfolio-web; do
              image=$(az containerapp show -n "$app" -g rg-chatbot \
                --query "properties.template.containers[0].image" -o tsv)
              revision=$(az containerapp show -n "$app" -g rg-chatbot \
                --query "properties.latestRevisionName" -o tsv)
              echo "- \`$app\`: \`$image\` (revision \`$revision\`)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy apps

# Manual only. Rolls the two container apps (ca-portfolio-backend and
# ca-portfolio-web) to images that CI already built for a commit on main (see
# the `build` job in ci.yml); it never builds.
# Run it from the Actions tab or: gh workflow run deploy-apps.yml --ref main
# Rollback is the same button with an older commit SHA. The MCP tools Function
# App has its own button (Deploy functions).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (empty = the head of main)
        required: false
        default: ""

# One deploy at a time; a second click waits instead of racing the first.
concurrency:
  group: deploy-apps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The history is fetched here; later steps only read it locally, so
          # keep the job's git token off disk while the Azure session is open.
          persist-credentials: false

      # Everything that can be checked without Azure is checked before logging in.
      - name: Resolve and validate the commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="$(./scripts/resolve-image-sha.sh "$INPUT_SHA")"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      # OIDC login with the Azure CLI (the repo only allows a short list of
      # third-party actions, so azure/login is not used).
      - name: Log in to Azure
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CLIENT_ID: ${{ vars.AZURE_APPS_DEPLOY_CLIENT_ID }}
        run: ./scripts/ci-azure-login.sh "$CLIENT_ID"

      - name: Roll the apps
        run: ./scripts/redeploy.sh "$SHA"

      - name: Wait for the new revisions
        run: ./scripts/wait-healthy.sh

      - name: Summary
        run: |
          {
            echo "### Deployed \`$SHA\`"
            echo
            git log -1 --format=%s "$SHA"
            echo
            for app in ca-portfolio-backend ca-portfolio-web; do
              image=$(az containerapp show -n "$app" -g rg-chatbot \
                --query "properties.template.containers[0].image" -o tsv)
              revision=$(az containerapp show -n "$app" -g rg-chatbot \
                --query "properties.latestRevisionName" -o tsv)
              echo "- \`$app\`: \`$image\` (revision \`$revision\`)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

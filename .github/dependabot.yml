version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /backend
      - /data
      - /mcp-tools
    schedule:
      interval: monthly
    labels:
      - dependencies
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      python:
        patterns:
          - "*"
    # Majors are done by hand: offline tests cannot prove they work.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    labels:
      - dependencies
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@copilotkit/*"
        versions: [">=1.85.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    labels:
      - dependencies
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
